name: Visual tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Argos authenticates through GitHub Actions OIDC, per repository.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  argos:
    name: Argos screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Zola
        run: |
          curl -fsSL -o zola.tar.gz https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf zola.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build:local
        env:
          GRAPHQL_MARKDOWN_TELEMETRY_DISABLED: "1"

      - name: Screenshot and upload to Argos
        run: npm run test:visual
